
[functions.otp]
enabled = true
verify_jwt = false
import_map = "./functions/otp/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/otp/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/otp/*.html" ]

[functions.send-pickup-reminder-emails]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-pickup-reminder-emails/index.ts"

[functions.send-customer-push-notifications]
enabled = true
verify_jwt = true
entrypoint = "./functions/send-customer-push-notifications/index.ts"
